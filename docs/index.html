<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafeeq رفيق · The AI buddy that teaches independence</title>
<meta name="description" content="Rafeeq: an owl robot that coaches children with autism, Down syndrome and ADHD through daily routines in Kuwaiti Arabic, powered by Gemma 3 running offline. Play the simulation.">
<meta name="theme-color" content="#0A0F1E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F1E;--bg2:#0F1630;--card:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);--text:#EEF2FF;--muted:#94A0BF;--orange:#FF7A3D;--orange2:#FFB27A;--teal:#3EE6C8;--blue:#7FB8FF;--gold:#FFD166;--red:#FF5A6A;--r:22px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Plus Jakarta Sans",sans-serif}
a{color:inherit}button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px;border-radius:10px}
.wrap{max-width:1240px;margin:auto;padding:0 22px}
.bgfx{position:fixed;inset:0;pointer-events:none;z-index:-1;background:radial-gradient(900px 600px at 80% -10%,rgba(255,122,61,.16),transparent 60%),radial-gradient(800px 600px at -10% 40%,rgba(62,230,200,.09),transparent 60%),radial-gradient(700px 500px at 60% 110%,rgba(127,184,255,.08),transparent 60%)}
header{position:sticky;top:0;z-index:60;background:rgba(10,15,30,.7);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;max-width:1240px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;text-decoration:none}
.brand b{color:var(--orange);font-family:"IBM Plex Sans Arabic"}
.links{display:flex;gap:24px;font-weight:600;font-size:14px}.links a{text-decoration:none;color:var(--muted)}.links a:hover{color:var(--text)}
.lang{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);font-size:13px}
.lang button.on{background:var(--text);color:var(--bg)}
.kick{font-weight:700;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--orange2)}
html[dir=rtl] .kick{letter-spacing:0;font-size:14px}
h1{font-size:clamp(40px,6vw,78px);line-height:1;margin:14px 0 18px;letter-spacing:-.035em;font-weight:800}
h2{font-size:clamp(30px,4vw,48px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.025em}
html[dir=rtl] h1,html[dir=rtl] h2{letter-spacing:0;line-height:1.25}
.grad{background:linear-gradient(90deg,var(--orange),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:520px;margin:0}
section{padding:90px 0}
.center{text-align:center}.center .lead{margin:auto}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:14px 22px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,#FF8A4C,#F2601F);color:#fff;box-shadow:0 10px 30px rgba(255,122,61,.35)}
.btn.primary:hover{box-shadow:0 14px 40px rgba(255,122,61,.5)}
.btn.ghost{background:var(--card);border:1px solid var(--line)}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.sm{padding:10px 15px;font-size:14px;border-radius:12px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:center;min-height:calc(100vh - 64px);padding:30px 0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:26px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:600;font-size:14px;color:#D5DCF0}
.heroOwl{position:relative;justify-self:center;width:min(470px,92%)}
.halo{position:absolute;inset:8% 6% 4%;border-radius:50%;background:radial-gradient(circle,rgba(255,122,61,.45),rgba(255,122,61,0) 65%);filter:blur(10px);animation:pulse 4s ease-in-out infinite}
.ring1,.ring2{position:absolute;left:50%;top:52%;border:1px solid rgba(62,230,200,.25);border-radius:50%;transform:translate(-50%,-50%)}
.ring1{width:105%;aspect-ratio:1;animation:spin 30s linear infinite}.ring2{width:125%;aspect-ratio:1;border-color:rgba(255,255,255,.06)}
.ring1:after{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--teal);box-shadow:0 0 14px var(--teal)}
#heroOwl svg{position:relative;width:100%;animation:float 5s ease-in-out infinite;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.say{position:absolute;top:6%;inset-inline-start:-4%;background:#fff;color:#14213D;border-radius:18px 18px 18px 4px;padding:10px 16px;font:700 18px "IBM Plex Sans Arabic";box-shadow:0 14px 30px rgba(0,0,0,.35);animation:float 5s ease-in-out infinite reverse}
@keyframes float{50%{transform:translateY(-14px)}}
@keyframes pulse{50%{opacity:.6;transform:scale(.95)}}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:30px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.tile .ic{font-size:28px;margin-bottom:10px;display:block}
.tile b{display:block;font-size:17px;margin-bottom:4px}.tile span{color:var(--muted);font-size:14px}
.simGrid{display:grid;grid-template-columns:1fr 290px;gap:18px;margin-top:34px;align-items:start}
.stage{position:relative;border-radius:26px;overflow:hidden;aspect-ratio:16/9.4;background:#1a2238;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px var(--line);user-select:none}
.stage *{direction:ltr}
#room,#room>div,.vignette,#fx{position:absolute;inset:0}
.vignette{pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 55%,rgba(10,15,30,.45) 100%)}
.redglow,.calmglow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .6s}
.redglow{background:radial-gradient(ellipse at 22% 62%,rgba(255,90,106,0) 30%,rgba(255,90,106,.5) 100%)}
.calmglow{background:radial-gradient(circle at 50% 55%,rgba(150,195,245,.55),rgba(60,90,150,.75))}
#kidWrap{position:absolute;left:9%;bottom:4%;width:21%}
#owlWrap{position:absolute;left:44%;bottom:23%;width:15.5%}
#noise{position:absolute;left:1%;bottom:30%;width:36%;pointer-events:none}
#fx{pointer-events:none;width:100%;height:100%}
.water{position:absolute;left:21.4%;top:57%;width:1.8%;height:15%;background:linear-gradient(rgba(190,230,255,.9),rgba(120,190,245,.6));border-radius:6px;opacity:0;transition:opacity .4s}
.water.on{opacity:1}
.vbox{position:absolute;left:6.5%;bottom:3%;width:26%;height:64%;pointer-events:none;transition:opacity .4s;opacity:0}
.vbox.on{opacity:1}
.vbox i{position:absolute;width:18px;height:18px;border:3px solid var(--teal);transition:border-color .3s}
.vbox i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:6px 0 0 0}.vbox i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 6px 0 0}
.vbox i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 6px}.vbox i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 6px 0}
.vbox .scan{position:absolute;left:4%;right:4%;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);animation:scan 2.2s ease-in-out infinite;opacity:.7}
@keyframes scan{0%,100%{top:6%}50%{top:92%}}
.vbox .tag{position:absolute;left:0;top:-30px;background:var(--teal);color:#062A25;font:700 12px ui-monospace,Menlo,monospace;padding:4px 9px;border-radius:7px;white-space:nowrap;transition:background .3s}
.vbox.alert i{border-color:var(--orange)}.vbox.alert .tag{background:var(--orange);color:#2a0d00}.vbox.alert .scan{background:linear-gradient(90deg,transparent,var(--orange),transparent)}
.bubble{position:absolute;right:3%;top:7%;max-width:44%;background:#fff;color:#14213D;border-radius:22px 22px 22px 6px;padding:13px 18px;box-shadow:0 14px 34px rgba(0,0,0,.3);transition:transform .25s cubic-bezier(.3,1.5,.6,1),opacity .2s;transform-origin:left bottom}
.bubble .ar{font:700 clamp(15px,2vw,25px)/1.4 "IBM Plex Sans Arabic";direction:rtl;text-align:right;min-height:1.4em}
.bubble .en{font-size:clamp(11px,1.1vw,14px);color:#5B6478;margin-top:2px}
.bubble.hide{opacity:0;transform:scale(.6)}
.breath{position:absolute;left:79%;top:62%;transform:translate(-50%,-50%);width:19%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 35%,#E3F0FF,#8FBCE8 70%);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:#14213D;opacity:0;transition:opacity .5s;font-size:clamp(11px,1.4vw,17px);box-shadow:0 0 0 14px rgba(200,225,255,.18),0 0 60px rgba(200,225,255,.6)}
.hud{position:absolute;left:14px;right:14px;top:14px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hudL{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:rgba(10,15,30,.72);backdrop-filter:blur(8px);color:#fff;border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:7px;border:1px solid rgba(255,255,255,.12)}
.dot{width:9px;height:9px;border-radius:50%;background:#9AA5B8;box-shadow:0 0 10px currentColor}
.meter{position:absolute;right:14px;bottom:14px;width:66px;height:66px}
.meter text{font:800 15px "Plus Jakarta Sans";fill:#fff}
.tracker{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px;background:rgba(10,15,30,.72);backdrop-filter:blur(8px);border-radius:999px;padding:7px 10px;border:1px solid rgba(255,255,255,.12)}
.tracker span{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#C9D2EA;transition:all .3s}
.tracker span.now{box-shadow:0 0 0 2px var(--orange);background:rgba(255,122,61,.2);color:#fff}
.tracker span.help{background:var(--teal);color:#062A25}
.tracker span.star{background:var(--gold);color:#3a2a00;transform:scale(1.12)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;background:rgba(10,15,30,.55);backdrop-filter:blur(3px);transition:opacity .35s;text-align:center;padding:20px}
.overlay.gone{opacity:0;pointer-events:none}
.overlay .big{font-size:clamp(20px,2.6vw,32px);font-weight:800}
.overlay .keys{color:#C9D2EA;font-size:13px}
.result{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(10,15,30,.5);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .4s}
.result.show{opacity:1;pointer-events:auto}
.resCard{background:rgba(15,22,48,.94);border:1px solid var(--line);border-radius:24px;padding:22px 26px;text-align:center;min-width:280px;box-shadow:0 30px 60px rgba(0,0,0,.5);transform:scale(.9);transition:transform .4s cubic-bezier(.3,1.5,.6,1)}
.result.show .resCard{transform:none}
.resStars{font-size:32px;letter-spacing:4px;margin:4px 0}
.resGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.resGrid div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px}.resGrid b{display:block;font-size:22px}.resGrid small{color:var(--muted)}
.ctl{display:grid;grid-template-columns:auto 1fr auto;gap:14px;margin-top:14px;align-items:stretch}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px}
.box .lab{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin:0 0 8px 2px}
html[dir=rtl] .box .lab{letter-spacing:0;font-size:12px}
.seg{display:flex;gap:6px}
.seg button{border:1px solid var(--line);background:rgba(255,255,255,.03);border-radius:12px;padding:8px 12px;cursor:pointer;font-weight:700;font-size:14px;transition:all .15s;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:58px}
.seg button .e{font-size:22px;line-height:1}
.seg button small{font-size:11px;color:var(--muted);font-weight:600}
.seg button.on{background:rgba(255,122,61,.16);border-color:var(--orange)}
.seg button:hover{border-color:rgba(255,255,255,.3)}
.wk .bar{width:30px;height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}.wk .bar i{display:block;height:100%;background:var(--orange)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:12px}
.acts button{position:relative;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border-radius:18px;padding:14px 8px 12px;cursor:pointer;font-weight:700;font-size:15px;transition:transform .1s,border-color .15s,box-shadow .2s}
.acts button .e{display:block;font-size:30px;line-height:1.1;margin-bottom:4px;transition:transform .2s}
.acts button:hover:not(:disabled){border-color:var(--orange);box-shadow:0 10px 30px rgba(255,122,61,.18)}
.acts button:hover:not(:disabled) .e{transform:scale(1.15) rotate(-6deg)}
.acts button:active:not(:disabled){transform:scale(.95)}
.acts button:disabled{opacity:.35;cursor:not-allowed}
.acts kbd{position:absolute;top:8px;inset-inline-end:10px;font:700 11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.phone{background:#05070F;border-radius:40px;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.5),0 0 0 1px var(--line)}
.screen{background:#F6F4F0;color:#14213D;border-radius:31px;min-height:500px;overflow:hidden;display:flex;flex-direction:column}
.notch{width:86px;height:22px;background:#05070F;border-radius:0 0 14px 14px;margin:0 auto}
.app{padding:10px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.appH{display:flex;align-items:center;justify-content:space-between}.appH b{font-size:15px}.appH small{color:#5B6478;font-size:12px}
.sum{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px}
.sum .t{font-size:12px;color:#5B6478}.sum .v{font-weight:800;font-size:16px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;overflow:auto;max-height:330px}
.feed li{background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:8px;animation:pop .35s cubic-bezier(.3,1.5,.6,1)}
.feed li time{color:#8A93A6;font-size:11px;min-width:32px;padding-top:1px}
@keyframes pop{from{transform:translateY(10px) scale(.95);opacity:0}}
details.raw{margin-top:14px}
details.raw summary{cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;list-style:none;display:inline-flex;gap:8px;align-items:center}
details.raw summary::-webkit-details-marker{display:none}
.log{margin-top:10px;font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;background:#05070F;color:#CFE0FF;border:1px solid var(--line);border-radius:16px;padding:14px;height:200px;overflow:auto;white-space:pre-wrap;direction:ltr;text-align:left}
.log .k{color:#7FE0C3}.log .w{color:#FFB27A}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:34px}
.step{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:24px;position:relative;overflow:hidden}
.step .n{position:absolute;top:14px;inset-inline-end:18px;font-size:48px;font-weight:800;color:rgba(255,255,255,.05)}
.step .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:16px}
.step b{display:block;font-size:19px;margin-bottom:4px}.step span{color:var(--muted);font-size:14px}
.model{margin-top:14px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;background:linear-gradient(135deg,rgba(255,122,61,.14),rgba(62,230,200,.08));border:1px solid rgba(255,122,61,.3);border-radius:var(--r);padding:22px 26px}
.model .mh{font-size:26px;font-weight:800}.model .mh small{font-size:14px;color:var(--muted);font-weight:600;margin-inline-start:8px}
.model code{display:inline-block;margin-top:8px;font:13px ui-monospace,Menlo,monospace;background:#05070F;color:#7FE0C3;border-radius:10px;padding:7px 12px;direction:ltr}
.mchips{display:flex;flex-wrap:wrap;gap:8px}.mchips span{background:rgba(10,15,30,.6);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px}
.hw{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;margin-top:20px}
.hwOwl{position:relative;width:min(400px,90%);justify-self:center}
#hwOwl svg{width:100%;filter:drop-shadow(0 30px 40px rgba(0,0,0,.45))}
.pin{position:absolute;width:30px;height:30px;border-radius:50%;background:#fff;color:var(--bg);font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;border:0;cursor:pointer;box-shadow:0 0 0 6px rgba(255,255,255,.15);transition:transform .15s,background .15s}
.pin:hover,.pin.on{transform:scale(1.2);background:var(--orange);color:#fff;box-shadow:0 0 0 8px rgba(255,122,61,.25)}
.parts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.part{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;transition:border-color .2s,background .2s}
.part.on{border-color:var(--orange);background:rgba(255,122,61,.08)}
.part .n{display:inline-flex;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--bg);font-size:12px;font-weight:800;align-items:center;justify-content:center;margin-inline-end:8px}
.part b{font-size:15px}.part span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.vidWrap{margin-top:30px;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.5),0 0 0 1px var(--line)}
video{width:100%;display:block;background:#000}
.end{text-align:center;padding:100px 22px}
.end h2{font-size:clamp(32px,5vw,60px)}
footer{padding:30px 0 50px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s,transform .7s}.reveal.in{opacity:1;transform:none}
.shake{animation:shake .35s linear infinite}
@keyframes shake{25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
@media(max-width:1060px){.simGrid{grid-template-columns:1fr}.phone{max-width:340px;width:100%;margin:auto}.screen{min-height:380px}.ctl{grid-template-columns:1fr 1fr}.ctl .box:last-child{grid-column:1/-1}.flow{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.hero,.hw{grid-template-columns:1fr}.hero{min-height:auto;padding:40px 0}.strip,.flow,.parts{grid-template-columns:1fr}.links{display:none}.ctl{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}.seg button{min-width:0;flex:1;padding:8px 6px}section{padding:60px 0}.bubble{max-width:52%;padding:9px 12px}.meter{width:50px;height:50px}.tracker span{width:24px;height:24px;font-size:12px}#hudWeek{display:none}.say{display:none}.vbox .tag{font-size:10px}.resCard,.result.show .resCard{transform:scale(.6)}.overlay .keys{display:none}}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}.skip{position:absolute;left:12px;top:-60px;z-index:999;background:var(--teal);color:#0A0F1E;padding:10px 16px;border-radius:10px;font-weight:700;text-decoration:none}.skip:focus{top:12px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>

 <radialGradient id="gBody" cx="38%" cy="30%" r="80%"><stop offset="0" stop-color="#FFA466"/><stop offset=".55" stop-color="#F06A26"/><stop offset="1" stop-color="#B9440F"/></radialGradient>

function noise(amt,tt){let h="";if(amt>.01)for(let k=0;k<3;k++){const r=90+k*55,a=amt*(.6+.4*Math.sin(tt*9+k));let p=[];for(let i=0;i<=14;i++){const g=-.9+1.8*i/14,j=(i%2?1:-1)*14*a;p.push(`${200+Math.cos(g)*(r+j)},${200+Math.sin(g)*(r+j)}`)}h+=`<polyline points="${p.join(" ")}" fill="none" stroke="#FF5A6A" stroke-width="9" stroke-linecap="round" opacity="${clamp(a)}"/>`;}$("noise").innerHTML=h;}

 noise(S&&(S.over||S.calm)?clamp((S.stress-30)/60):0,tt);
