<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rafeeq رفيق · Interactive Simulation</title>
<meta name="description" content="Rafeeq: an Arabic Gen-AI owl robot that coaches children with autism, Down syndrome and ADHD through daily routines, then steps back. Try the interactive simulation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F2;--bg2:#F3ECE3;--ink:#14213D;--muted:#5B6478;--line:#E7DED2;--orange:#E76F2E;--deep:#B84E14;--peach:#F4C9A8;--teal:#2EC4B6;--green:#1F7A5A;--calm:#8FBCE0;--gold:#FFD166;--red:#E5484D;--card:#fff;--r:24px;--shadow:0 10px 40px rgba(20,33,61,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
html[dir=rtl] body{font-family:"IBM Plex Sans Arabic","Plus Jakarta Sans",sans-serif}
.ar{font-family:"IBM Plex Sans Arabic",sans-serif}
a{color:inherit}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:8px}
.wrap{max-width:1220px;margin:auto;padding:0 22px}
/* header */
header{position:sticky;top:0;z-index:50;background:rgba(251,247,242,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 22px;max-width:1220px;margin:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;text-decoration:none}
.brand b{color:var(--orange);font-family:"IBM Plex Sans Arabic"}
.links{display:flex;gap:22px;font-weight:600;font-size:15px}
.links a{text-decoration:none;color:var(--muted)}.links a:hover{color:var(--ink)}
.lang{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:3px}
.lang button{border:0;background:none;padding:6px 13px;border-radius:999px;font-weight:700;cursor:pointer;color:var(--muted);font-size:14px}
.lang button.on{background:var(--ink);color:#fff}
/* type */
.kick{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--deep)}
html[dir=rtl] .kick{letter-spacing:0}
h1{font-size:clamp(36px,5.4vw,64px);line-height:1.04;margin:12px 0 16px;letter-spacing:-.025em}
h2{font-size:clamp(28px,3.6vw,42px);line-height:1.1;margin:8px 0 10px;letter-spacing:-.015em}
html[dir=rtl] h1,html[dir=rtl] h2{letter-spacing:0;line-height:1.3}
h3{margin:0 0 6px;font-size:18px}
.lead{font-size:19px;color:var(--muted);max-width:580px}
.sub{color:var(--muted);max-width:720px;margin:0 0 22px}
section{padding:70px 0}
.hl{color:var(--orange)}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;padding:13px 20px;font-weight:700;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .12s,box-shadow .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--orange);color:#fff;box-shadow:0 6px 18px rgba(231,111,46,.35)}
.btn.primary:hover{box-shadow:0 8px 24px rgba(231,111,46,.45)}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 2px 10px rgba(20,33,61,.08)}
.btn.sm{padding:10px 15px;font-size:15px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
/* hero */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:30px;align-items:center;padding:56px 0 40px}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0}
.badge{background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:600;font-size:14px}
.owlHero{position:relative;justify-self:center;width:min(380px,90%)}
.owlHero .blob{position:absolute;inset:6% 2% 0;background:radial-gradient(circle at 50% 45%,#FFE3CF,rgba(255,227,207,0) 70%)}
.owlHero svg{position:relative;width:100%;animation:float 4s ease-in-out infinite}
.owlHero .lid{animation:blink 4.5s infinite;transform-origin:center 190px}
@keyframes float{50%{transform:translateY(-12px)}}
@keyframes blink{0%,94%,100%{transform:scaleY(0)}96%{transform:scaleY(1)}}
.chip{position:absolute;background:#fff;border-radius:16px;padding:9px 13px;box-shadow:var(--shadow);font-weight:700;font-size:14px;white-space:nowrap}
.chip small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.chip.a{top:8%;inset-inline-start:-8%} .chip.b{bottom:16%;inset-inline-end:-6%}
/* problem */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:var(--card);border-radius:var(--r);padding:24px;box-shadow:var(--shadow)}
.card .ic{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--bg2);margin-bottom:14px}
.card p{margin:0;color:var(--muted)}
.band{background:var(--ink);color:#F7F3EE;border-radius:32px;padding:30px 34px;margin-top:22px;display:flex;align-items:center;gap:20px;font-size:clamp(20px,2.4vw,28px);font-weight:700}
.band span{color:#F4A261}
/* simulator */
.simSec{background:linear-gradient(180deg,var(--bg) 0,var(--bg2) 100%)}
.simTop{display:grid;grid-template-columns:1fr 300px;gap:20px;align-items:start}
.stage{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:16/10;box-shadow:0 18px 50px rgba(20,33,61,.14);background:#EAF1F4}
.stage *{direction:ltr}
#room,#room>div{position:absolute;inset:0}
.water{position:absolute;left:21%;top:58%;width:2.2%;height:16%;background:linear-gradient(#bfe3ff,#7fc4f5);border-radius:6px;opacity:0;transition:opacity .4s}
.water.on{opacity:.9;animation:drip .25s linear infinite}
@keyframes drip{50%{transform:scaleX(.8)}}
.redglow,.calmglow{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
.redglow{background:radial-gradient(ellipse at 25% 62%,rgba(229,72,77,0) 35%,rgba(229,72,77,.42) 100%)}
.calmglow{background:radial-gradient(circle at 50% 50%,rgba(220,236,250,.95),rgba(190,215,240,.92))}
#kidWrap{position:absolute;left:8%;bottom:5%;width:22%}
#owlWrap{position:absolute;left:43%;bottom:24%;width:16%}
#noise{position:absolute;left:2%;bottom:32%;width:34%;pointer-events:none}
.bubble{position:absolute;right:3%;top:6%;width:44%;background:#fff;border-radius:22px;padding:14px 18px;box-shadow:0 8px 24px rgba(20,33,61,.14);transition:transform .25s,opacity .25s;transform-origin:left bottom}
.bubble:after{content:"";position:absolute;left:-10px;bottom:22px;border:12px solid transparent;border-right-color:#fff;border-left:0}
.bubble .ar{font-weight:700;font-size:clamp(15px,2vw,24px);line-height:1.4;direction:rtl;text-align:right}
.bubble .en{font-size:clamp(11px,1.15vw,14px);color:var(--muted);margin-top:3px}
.bubble.hide{opacity:0;transform:scale(.85)}
.breath{position:absolute;left:78%;top:64%;transform:translate(-50%,-50%);width:20%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,#B9D6F0,#7FB0DC);display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;color:var(--ink);opacity:0;transition:opacity .5s;font-size:clamp(11px,1.4vw,17px);box-shadow:0 0 0 12px rgba(143,188,224,.25)}
.cheer{position:absolute;left:40%;top:36%;font:700 clamp(22px,3.2vw,40px) "IBM Plex Sans Arabic";color:var(--orange);opacity:0;text-shadow:0 3px 0 #fff}
.stageHud{position:absolute;left:14px;top:14px;display:flex;gap:8px}
.pill{background:rgba(255,255,255,.92);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#9AA5B8}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,33,61,.35);backdrop-filter:blur(2px);transition:opacity .3s}
.overlay.gone{opacity:0;pointer-events:none}
.confetti{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(560px) rotate(540deg);opacity:0}}
/* phone */
.phone{background:#0F172A;border-radius:42px;padding:12px;box-shadow:0 18px 50px rgba(20,33,61,.22)}
.screen{background:#F7F5F1;border-radius:32px;height:100%;min-height:460px;overflow:hidden;display:flex;flex-direction:column}
.notch{width:90px;height:22px;background:#0F172A;border-radius:0 0 14px 14px;margin:0 auto}
.app{padding:10px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.appH{display:flex;align-items:center;justify-content:space-between}
.appH b{font-size:15px}.appH small{color:var(--muted);font-size:12px}
.ringWrap{display:flex;align-items:center;gap:12px;background:#fff;border-radius:18px;padding:12px}
.ringWrap .t{font-size:13px;color:var(--muted)}.ringWrap .v{font-weight:800;font-size:17px}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;overflow:auto;flex:1;max-height:260px}
.feed li{background:#fff;border-radius:12px;padding:8px 10px;font-size:13px;display:flex;gap:8px;align-items:flex-start;animation:pop .3s}
.feed li time{color:var(--muted);font-size:11px;min-width:34px;padding-top:1px}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
.empty{color:var(--muted);font-size:13px;text-align:center;margin-top:30px}
/* controls */
.ctlRow{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;margin-top:20px}
.panel{background:var(--card);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow)}
.panel h3{font-size:15px;display:flex;align-items:center;gap:8px}
.num{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;display:inline-flex;align-items:center;justify-content:center}
select{width:100%;font:600 15px inherit;font-family:inherit;padding:11px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--orange)}
.lbl{display:flex;justify-content:space-between;font-weight:700;font-size:14px;gap:8px}
.lbl span:last-child{color:var(--muted);font-weight:600}
.act{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.act button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;font-weight:700;font-size:14px;cursor:pointer;color:var(--ink);transition:border-color .15s,transform .1s}
.act button:hover:not(:disabled){border-color:var(--orange)}
.act button:active{transform:scale(.97)}
.act button:disabled{opacity:.4;cursor:not-allowed}
.act .em{display:block;font-size:22px;line-height:1.2}
.steps{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px}
.steps li{display:flex;gap:10px;align-items:center;background:var(--bg);border-radius:12px;padding:8px 11px;font-weight:600;font-size:14px;color:#8A93A6;transition:all .3s}
.steps .c{width:22px;height:22px;border-radius:50%;background:#D9D3CA;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.steps li.done{color:var(--ink)}.steps li.done .c{background:var(--green)}
.steps li.now{color:var(--ink);box-shadow:inset 0 0 0 2px var(--orange);background:#fff}
.track{height:12px;background:#EEE8E0;border-radius:8px;overflow:hidden;margin-top:6px}
.fill{height:100%;width:20%;background:var(--green);border-radius:8px;transition:width .45s,background .45s}
/* bottom row */
.botRow{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;margin-top:18px}
.log{font:12px/1.55 ui-monospace,Menlo,Consolas,monospace;background:#0F172A;color:#CFE0FF;border-radius:16px;padding:14px;height:220px;overflow:auto;white-space:pre-wrap;direction:ltr;text-align:left}
.log .k{color:#7FE0C3}.log .w{color:#F4A261}
.chart{width:100%;height:auto}
.note{font-size:13px;color:var(--muted)}
/* how */
.pipe{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;position:relative}
.pipe .card{padding:20px;position:relative}
.pipe .card small{display:inline-block;background:var(--bg2);border-radius:8px;padding:2px 8px;font-weight:700;font-size:12px;margin-bottom:8px;color:var(--deep)}
.pipe .card p{font-size:14px}
.calmCard{margin-top:14px;display:flex;gap:16px;align-items:center;background:#E8F1FA;border-radius:var(--r);padding:18px 22px}
/* hardware */
.hw{display:grid;grid-template-columns:.9fr 1.1fr;gap:30px;align-items:center}
.hwOwl{position:relative;max-width:420px;justify-self:center;width:100%}
.hwOwl .pin{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px rgba(20,33,61,.15);cursor:pointer;transition:transform .15s}
.hwOwl .pin:hover,.hwOwl .pin.on{transform:scale(1.18);background:var(--orange)}
.parts{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.parts li{display:flex;gap:14px;align-items:flex-start;background:#fff;border-radius:18px;padding:14px 16px;box-shadow:var(--shadow);border:2px solid transparent;transition:border-color .2s}
.parts li.on{border-color:var(--orange)}
.parts .num{flex:none;margin-top:2px}
.parts p{margin:0;color:var(--muted);font-size:14px}
.privacy{margin-top:14px;display:flex;gap:12px;align-items:center;background:var(--ink);color:#F7F3EE;border-radius:18px;padding:14px 18px;font-size:15px}
/* video */
video{width:100%;border-radius:28px;background:#000;box-shadow:0 18px 50px rgba(20,33,61,.18);display:block}
/* criteria */
.crit{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.crit .card{padding:20px}
.crit .card b{display:block;font-size:13px;color:var(--deep);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
html[dir=rtl] .crit .card b{letter-spacing:0}
footer{padding:40px 0 60px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
@media(max-width:1020px){.simTop{grid-template-columns:1fr}.phone{max-width:340px;margin:auto;width:100%}.ctlRow{grid-template-columns:1fr 1fr}.ctlRow .panel:last-child{grid-column:1/-1}.pipe{grid-template-columns:1fr 1fr}.crit{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.hero,.hw,.botRow{grid-template-columns:1fr}.grid3,.ctlRow,.pipe,.crit{grid-template-columns:1fr}.links{display:none}.chip{display:none}section{padding:50px 0}.band{flex-direction:column;align-items:flex-start}.screen{min-height:330px}.stageHud{top:auto;bottom:10px}#hudWeek{display:none}.bubble{width:50%;padding:10px 12px}.feed{max-height:200px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}}
</style>
</head>
<body>
<header><div class="nav">
  <a class="brand" href="#top"><svg width="30" height="32" viewBox="0 0 400 420" aria-hidden="true"><ellipse cx="200" cy="230" rx="150" ry="165" fill="#E76F2E"/><ellipse cx="200" cy="275" rx="95" ry="110" fill="#F4C9A8"/><circle cx="140" cy="185" r="58" fill="#fff"/><circle cx="260" cy="185" r="58" fill="#fff"/><circle cx="148" cy="190" r="26" fill="#14213D"/><circle cx="252" cy="190" r="26" fill="#14213D"/></svg>Rafeeq <b>رفيق</b></a>
  <nav class="links"><a href="#sim" data-i="nav.sim"></a><a href="#how" data-i="nav.how"></a><a href="#hardware" data-i="nav.hw"></a><a href="#video" data-i="nav.vid"></a><a href="https://github.com/abdullahnaji353-blip/rafeeq">GitHub</a></nav>
  <div class="lang" role="group" aria-label="Language"><button id="lEn" class="on">EN</button><button id="lAr" class="ar">عربي</button></div>
</div></header>

<main id="top">
<div class="wrap">
  <div class="hero">
    <div class="reveal">
      <div class="kick" data-i="hero.kick"></div>
      <h1 data-i="hero.h1"></h1>
      <p class="lead" data-i="hero.lead"></p>
      <div class="row" style="margin-top:24px"><a class="btn primary" href="#sim" data-i="hero.cta1"></a><a class="btn ghost" href="#video" data-i="hero.cta2"></a></div>
      <div class="badges"><span class="badge" data-i="b1"></span><span class="badge" data-i="b2"></span><span class="badge" data-i="b3"></span></div>
    </div>
    <div class="owlHero reveal">
      <div class="blob"></div>
      <svg viewBox="0 0 400 440" role="img" aria-label="Rafeeq owl robot"><ellipse cx="200" cy="420" rx="120" ry="14" fill="rgba(0,0,0,.08)"/><path d="M85 95 L120 150 L150 100 Z" fill="#C4561C"/><path d="M315 95 L280 150 L250 100 Z" fill="#C4561C"/><ellipse cx="200" cy="230" rx="150" ry="165" fill="#E76F2E"/><ellipse cx="200" cy="275" rx="95" ry="110" fill="#F4C9A8"/><path d="M150 300 q50 30 100 0" stroke="#E8B48E" stroke-width="8" fill="none" stroke-linecap="round"/><circle cx="140" cy="185" r="58" fill="#fff"/><circle cx="260" cy="185" r="58" fill="#fff"/><circle cx="140" cy="190" r="34" fill="none" stroke="#2EC4B6" stroke-width="6" opacity=".9"/><circle cx="260" cy="190" r="34" fill="none" stroke="#2EC4B6" stroke-width="6" opacity=".9"/><circle cx="140" cy="190" r="24" fill="#14213D"/><circle cx="260" cy="190" r="24" fill="#14213D"/><circle cx="150" cy="180" r="8" fill="#fff"/><circle cx="270" cy="180" r="8" fill="#fff"/><g class="lid"><ellipse cx="140" cy="185" rx="60" ry="60" fill="#E76F2E"/><ellipse cx="260" cy="185" rx="60" ry="60" fill="#E76F2E"/></g><path d="M185 235 L215 235 L200 262 Z" fill="#14213D"/></svg>
      <div class="chip a ar">شاطر يوسف! 🌟<small data-i="chip1"></small></div>
      <div class="chip b"><span data-i="chip2"></span><small data-i="chip2s"></small></div>
    </div>
  </div>
</div>

<section id="problem"><div class="wrap">
  <div class="reveal"><div class="kick" data-i="pr.kick"></div><h2 data-i="pr.h2"></h2></div>
  <div class="grid3" style="margin-top:22px">
    <div class="card reveal"><div class="ic">🖼️</div><h3 data-i="pr.1t"></h3><p data-i="pr.1d"></p></div>
    <div class="card reveal"><div class="ic">🧍</div><h3 data-i="pr.2t"></h3><p data-i="pr.2d"></p></div>
    <div class="card reveal"><div class="ic">🗣️</div><h3 data-i="pr.3t"></h3><p data-i="pr.3d"></p></div>
  </div>
  <div class="band reveal"><svg width="56" height="60" viewBox="0 0 400 420" style="flex:none" aria-hidden="true"><ellipse cx="200" cy="230" rx="150" ry="165" fill="#E76F2E"/><ellipse cx="200" cy="275" rx="95" ry="110" fill="#F4C9A8"/><circle cx="140" cy="185" r="58" fill="#fff"/><circle cx="260" cy="185" r="58" fill="#fff"/><circle cx="148" cy="190" r="26" fill="#14213D"/><circle cx="252" cy="190" r="26" fill="#14213D"/></svg><div data-i="band"></div></div>
</div></section>

<section id="sim" class="simSec"><div class="wrap">
  <div class="reveal"><div class="kick" data-i="sim.kick"></div><h2 data-i="sim.h2"></h2><p class="sub" data-i="sim.sub"></p></div>
  <div class="simTop">
    <div class="stage" id="stage">
      <div id="room"></div>
      <div class="water" id="water"></div>
      <div class="calmglow" id="calmglow"></div>
      <svg id="noise" viewBox="0 0 400 400"></svg>
      <div id="kidWrap"></div>
      <div id="owlWrap"></div>
      <div class="breath" id="breath"></div>
      <div class="cheer" id="cheer"></div>
      <div class="bubble hide" id="bubble"><div class="ar" id="bAr"></div><div class="en" id="bEn"></div></div>
      <div class="redglow" id="redglow"></div>
      <div class="stageHud"><span class="pill"><span class="dot" id="hudDot"></span><span id="hudMode"></span></span><span class="pill" id="hudWeek"></span></div>
      <div class="overlay" id="overlay"><div class="row" style="justify-content:center"><button class="btn primary" id="ovStart" data-i="ov.start"></button><button class="btn ghost" id="ovAuto" data-i="ov.auto"></button></div></div>
    </div>

 log({event:"routine_complete",steps_alone:s.alone,hints:s.hints,calm_downs:s.calms,seconds:secs},"report sent to parent app");
 addFeed("🎉",()=>`<b>${t("f.finish")}</b><br>${t("rep.alone")}: <b>${s.alone}/${n}</b><br>${t("rep.hints")}: <b>${s.hints}</b><br>${t("rep.calms")}: <b>${s.calms}</b><br>${t("rep.time")}: <b>${secs}s</b><br><span style="color:var(--muted)">${t(s.week<4?"rep.tip1":"rep.tip4")}</span>`,
  ()=>`<b>${t("f.finish")}</b><br>${t("rep.alone")}: <b>${s.alone}/${n}</b><br>${t("rep.hints")}: <b>${s.hints}</b><br>${t("rep.calms")}: <b>${s.calms}</b><br>${t("rep.time")}: <b>${secs} ث</b><br><span style="color:var(--muted)">${t(s.week<4?"rep.tip1":"rep.tip4")}</span>`);}
function updateWater(){$("water").classList.toggle("on",!!S&&S.key==="hands"&&S.step>=1&&S.step<3);}
function auto(){$("routine").value="teeth";$("week").value=1;$("weekLbl").textContent=t("w1");start();
 [[3800,"do"],[7000,"overload"],[17200,"do"],[21000,"distract"],[24200,"do"],[28200,"do"]].forEach(([ms,a])=>autoTimers.push(setTimeout(()=>act(a),ms)));
 $("sim").scrollIntoView({behavior:"smooth"});}
/* ---------------- wiring ---------------- */
$("start").onclick=start;$("ovStart").onclick=start;$("auto").onclick=auto;$("ovAuto").onclick=auto;
$("week").oninput=e=>{$("weekLbl").textContent=t("w"+e.target.value);if(!S||S.finished){$("hudWeek").textContent=t("wS"+e.target.value);renderChart();}};
$("routine").onchange=()=>{if(!S||S.finished){$("room").innerHTML=ROOMS[R[$("routine").value].room];$("kid").querySelector(".prop").innerHTML=PROPS[$("routine").value];S=null;feed=[];renderSteps();renderFeed();}};
$("sound").onclick=()=>{sound=!sound;$("sound").textContent=t(sound?"snd.on":"snd.off");if(sound&&"speechSynthesis"in window)speechSynthesis.getVoices();};
document.querySelectorAll(".act button").forEach(b=>b.onclick=()=>act(b.dataset.a));
$("lEn").onclick=()=>{lang="en";applyLang()};$("lAr").onclick=()=>{lang="ar";applyLang()};
function pickPart(p){document.querySelectorAll("[data-p]").forEach(e=>e.classList.toggle("on",e.dataset.p===p));}
document.querySelectorAll(".pin,.parts li").forEach(e=>{e.addEventListener("click",()=>pickPart(e.dataset.p));e.addEventListener("mouseenter",()=>pickPart(e.dataset.p));});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}}),{threshold:.12});
document.querySelectorAll(".reveal").forEach(e=>io.observe(e));
/* init */
try{const s=localStorage.getItem("rafeeqLang");if(s==="ar"||s==="en")lang=s;}catch(e){}
$("room").innerHTML=ROOMS.bath;$("kid").querySelector(".prop").innerHTML=PROPS.teeth;enableActs(false);applyLang();
/* ---------------- animation loop ---------------- */
function drawNoise(amt,tt){let h="";if(amt>0.01)for(let k=0;k<3;k++){const r=90+k*55,a=amt*(.6+.4*Math.sin(tt*9+k));let pts=[];for(let i=0;i<=14;i++){const ang=-.9+1.8*i/14,j=(i%2?1:-1)*14*a;pts.push(`${200+Math.cos(ang)*(r+j)},${200+Math.sin(ang)*(r+j)}`)}h+=`<polyline points="${pts.join(" ")}" fill="none" stroke="#E5484D" stroke-width="9" stroke-linecap="round" opacity="${clamp(a)}"/>`;}$("noise").innerHTML=h;}
function loop(now){const tt=now/1000,k=$("kid"),o=$("owl");
 pose.rock=S&&S.over&&!S.calm?7*Math.sin(tt*6.5):S&&S.calm?pose.ears*7*Math.sin(tt*6.5):0;
 pose.blink=(tt%2.9)<.14?1:(pose.ears>.5?.85:0);
 k.querySelector(".rock").style.transform=`rotate(${pose.rock}deg)`;k.querySelector(".armL").style.transform=`rotate(${lerp(8,152,pose.ears)}deg)`;
 k.querySelector(".armR").style.transform=`rotate(${pose.ears>.5?lerp(-8,-152,pose.ears):pose.armR}deg)`;
 const m=pose.mood;k.querySelector(".mouth").setAttribute("d",`M120 ${200-6*m} Q150 ${200+22*m} 180 ${200-6*m}`);const tb=m<0?-m*10:0;
 k.querySelector(".bL").setAttribute("d",`M96 ${120+tb} L130 ${122-tb}`);k.querySelector(".bR").setAttribute("d",`M170 ${122-tb} L204 ${120+tb}`);
 k.querySelectorAll(".e").forEach(e=>e.setAttribute("ry",12*(1-.9*pose.blink)));
 const shut=Math.max(owlS.sleepy*.5,(tt%3.4)<.14?1:0);o.querySelectorAll(".w").forEach(e=>e.setAttribute("ry",58*(1-.85*shut)));
 o.querySelectorAll(".p").forEach((e,i)=>{e.setAttribute("ry",24*(1-shut));e.setAttribute("cx",(i?252:132)+(owlS.look?-14:0))});
 o.querySelectorAll(".led").forEach(e=>e.setAttribute("opacity",1-shut));
 const talk=now<owlS.talkUntil?Math.abs(Math.sin(tt*11)):0;o.querySelector(".beak").style.transform=`scaleY(${1+.7*talk})`;
 o.querySelector(".glow").setAttribute("opacity",.35*owlS.glow*(.8+.2*Math.sin(tt*1.6)));
 o.querySelector(".head").style.transform=`rotate(${owlS.look?-10:0}deg)`;
 const hop=owlS.hop&&now-owlS.hop<420?Math.sin((now-owlS.hop)/420*Math.PI)*18:0;$("owlWrap").style.transform=`translateY(${-hop-(mode==="idle"?3*Math.sin(tt*2):0)}px)`;
 drawNoise(S&&(S.over||S.calm)?clamp((S.stress-30)/60):0,tt);
 if(S&&S.calm){const br=.5-.5*Math.cos(tt*2*Math.PI/4);$("breath").style.transform=`translate(-50%,-50%) scale(${.75+.45*br})`;$("breath").textContent=t(Math.sin(tt*2*Math.PI/4)>=0?"breathIn":"breathOut");}
 requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
