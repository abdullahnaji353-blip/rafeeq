<!DOCTYPE html>
<html lang="ar" translate="no" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رفيق · Rafeeq demo</title>
<style>
  :root{--bg:#0F1733;--card:#18224A;--ink:#F3F5FB;--muted:#A9B4D6;--orange:#FF7A2F;--teal:#3EE6C8;--calm:#7FB8FF;--ok:#3ED6B4;--line:rgba(255,255,255,.12)}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 16px 40px}
  a{color:var(--orange)}
  .top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
  .badge{background:rgba(255,255,255,.08);border-radius:999px;padding:4px 10px;direction:ltr}
  .badge.mock{background:rgba(255,176,32,.18);color:#FFD27A}
  .owlbox{position:relative;width:170px;height:180px;margin-top:6px}
  .owl{width:100%;height:100%;transition:transform .3s}
  .owl.talk{animation:bob .5s ease-in-out infinite alternate}
  .owl.happy{animation:hop .4s ease-out 3}
  .owl.nod{animation:nod .5s ease-in-out 2}
  @keyframes bob{to{transform:rotate(-4deg)}}
  @keyframes hop{50%{transform:translateY(-14px)}}
  @keyframes nod{50%{transform:translateY(6px) rotate(2deg)}}
  .ring{fill:none;stroke-width:10;stroke-linecap:round;transform:rotate(-90deg);transform-box:fill-box;transform-origin:center;transition:stroke-dashoffset .9s linear,stroke .4s}
  .glow{transition:fill .4s}
  h1{margin:2px 0 0;font-size:26px}
  .bubble{background:#fff;color:#0F1733;border-radius:20px;padding:14px 18px;font-size:22px;font-weight:700;min-height:60px;width:100%;max-width:560px;text-align:center;margin:10px 0 12px}
  .bubble small{display:block;font-size:14px;font-weight:500;color:#55607E}
  .stage{position:relative;width:100%;max-width:560px}
  video{width:100%;border-radius:20px;background:#000;aspect-ratio:4/3;object-fit:cover;display:block}
  .camoff{display:none;position:absolute;inset:0;border-radius:20px;background:#000;color:#fff;align-items:center;justify-content:center;text-align:center;font-size:18px;padding:20px}
  .calm{display:none;position:absolute;inset:0;border-radius:20px;background:rgba(10,20,50,.86);flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .calm.on{display:flex}
  .breath{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#BFDBFF,#7FB8FF);animation:breathe 8s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1.15);opacity:1}}
  .calm p{margin:0;font-size:20px;font-weight:700}
  .calm button{background:#fff;color:#0F1733;border:0}
  .reward{display:none;background:linear-gradient(135deg,#FFB020,#FF7A2F);color:#fff;border-radius:20px;padding:18px;width:100%;max-width:560px;text-align:center;font-size:22px;font-weight:800;margin-top:12px}
  .steps{list-style:none;padding:0;margin:12px 0;width:100%;max-width:560px}
  .steps li{background:var(--card);border-radius:14px;padding:10px 14px;margin:6px 0;font-size:17px;display:flex;justify-content:space-between;align-items:center;gap:10px;opacity:.6}
  .steps li.now{opacity:1;box-shadow:inset 0 0 0 2px var(--orange)}
  .steps li.done{opacity:1;color:var(--ok)}
  .lv{font-size:12px;color:var(--muted);background:rgba(255,255,255,.07);border-radius:999px;padding:3px 9px;white-space:nowrap}
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:560px}
  select,button{font:inherit;font-size:16px;border-radius:12px;border:1px solid var(--line);padding:10px 12px;background:var(--card);color:var(--ink)}
  button{cursor:pointer}
  button.go{background:var(--orange);border-color:var(--orange);color:#fff;font-weight:700;flex:1}
  button:disabled{opacity:.45;cursor:not-allowed}
  .report{display:none;background:var(--card);border-radius:20px;padding:16px 18px;width:100%;max-width:560px;margin-top:12px;font-size:16px;line-height:1.7}
  .report .chg{color:var(--teal)}
  .err{color:#FF8A8A;font-size:14px;min-height:20px;margin:6px 0}
  .modes{font-size:13px;color:var(--muted);margin-top:6px;text-align:center}
  .band{display:none;width:100%;max-width:560px;margin-top:8px;background:var(--card);border-radius:16px;padding:10px 14px;align-items:center;gap:12px;flex-wrap:wrap}
  .band.on{display:flex}
  .hr{font-size:26px;font-weight:800;min-width:96px;direction:ltr}
  .hr .beat{display:inline-block;animation:beat 1s ease-in-out infinite}
  @keyframes beat{15%{transform:scale(1.25)}30%{transform:scale(1)}}
  .hr.up{color:#FF8A8A}
  .bandInfo{flex:1;font-size:13px;color:var(--muted);min-width:150px}
  .band button{font-size:14px;padding:8px 10px}
</style>
</head>
<body>
  <div class="top"><a href="parent.html">⚙️ تطبيق الأهل · Parent app</a><span class="badge" id="model">…</span></div>

  <div class="owlbox">
  <svg class="owl" id="owl" viewBox="0 0 400 420" aria-label="رفيق">
    <ellipse cx="200" cy="230" rx="150" ry="165" fill="#FF7A2F"/>
    <ellipse cx="200" cy="275" rx="95" ry="110" fill="#FCE3CF"/>
    <path d="M85 95 L120 150 L150 100 Z" fill="#C24E14"/><path d="M315 95 L280 150 L250 100 Z" fill="#C24E14"/>
    <circle cx="140" cy="185" r="58" fill="#fff"/><circle cx="260" cy="185" r="58" fill="#fff"/>
    <circle class="glow" id="gL" cx="140" cy="185" r="48" fill="#E8FFF9"/><circle class="glow" id="gR" cx="260" cy="185" r="48" fill="#E8FFF9"/>
    <circle class="ring" id="rL" cx="140" cy="185" r="66" stroke="#3EE6C8" stroke-dasharray="414.7" stroke-dashoffset="414.7"/>
    <circle class="ring" id="rR" cx="260" cy="185" r="66" stroke="#3EE6C8" stroke-dasharray="414.7" stroke-dashoffset="414.7"/>
    <circle cx="148" cy="190" r="26" fill="#14213D"/><circle cx="252" cy="190" r="26" fill="#14213D"/>
    <path d="M185 235 L215 235 L200 262 Z" fill="#14213D"/>
  </svg>
  </div>
  <h1>رفيق</h1>

  <div class="bubble" id="bubble">هلا! اختار الروتين واضغط "ابدأ" 🦉</div>

  <div class="stage">
    <video id="cam" playsinline muted autoplay></video>
    <div class="camoff" id="camoff">📷🚫<br>الكاميرا مطفية من تطبيق الأهل<br><small>Camera is switched off in the parent app</small></div>
    <div class="calm" id="calm"><div class="breath"></div><p id="calmTxt">خذ نفس معاي…</p><button id="calmEnd">أحسن الحين 👍</button></div>
  </div>

  <ul class="steps" id="steps"></ul>

  <div class="row">
    <select id="routine"></select>
    <select id="facing">
      <option value="user">الكاميرا الأمامية</option>
      <option value="environment">الكاميرا الخلفية</option>
    </select>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="go" id="go">ابدأ</button>
    <button id="calmBtn" title="Calm mode">😣 هدوء</button>
    <button id="stop">إيقاف</button>
  </div>
  <div class="band" id="band">
    <div class="hr" id="hr"><span class="beat">💓</span> <span id="bpm">—</span></div>
    <div class="bandInfo" id="bandInfo">سوار رفيق · Rafeeq Band</div>
    <button id="bandConnect">⌚ وصّل السوار</button>
    <button id="bandSim" title="For trying it without a band">🧪 سوار تجريبي</button>
    <button id="bandStress" style="display:none" title="Simulated band only">📈 ارفع النبض</button>
  </div>
  <p class="modes" id="modes"></p>
  <p class="err" id="err"></p>

  <div class="reward" id="reward"></div>
  <div class="report" id="report"></div>

<script>
const CHECK_EVERY_MS = 3000;
const LV_AR = ["توجيه كامل", "تلميح خفيف", "ساكت إلا إذا احتاج"];
const $ = id => document.getElementById(id);
let S = null;                 // state from the server
let stream = null, timer = null, busy = false;
let run = null;               // the routine being done right now
let lastSaid = "", lastSaidAt = 0;
let AC = null, calmNodes = [], micStream = null, micTimer = null;

/* ---------- state ---------- */
async function load() {
  S = await (await fetch("/api/state")).json();
  const sel = $("routine"), keep = sel.value;
  sel.innerHTML = S.routines.map(r => `<option value="${r.id}">${r.icon} ${r.name}</option>`).join("");
  if (keep && S.routines.some(r => r.id === keep)) sel.value = keep;
  $("model").textContent = S.provider;
  $("model").classList.toggle("mock", S.provider.startsWith("mock"));
  const p = S.profile, m = [];
  if (p.language === "en") m.push("English");
  if (p.simpleWords) m.push("كلمات بسيطة");
  if (p.quiet) m.push("بدون صوت");
  if (p.reward) m.push("أول، بعدين: " + p.reward);
  if (p.noiseCheck) m.push("ينتبه للأصوات العالية");
  if (p.band) m.push("سوار رفيق");
  $("modes").textContent = m.length ? "الإعدادات: " + m.join(" · ") : "";
  $("camoff").style.display = p.cameraOn ? "none" : "flex";
  bandShow();
  $("go").disabled = !p.cameraOn;
  renderSteps();
}
const routine = () => S.routines.find(r => r.id === $("routine").value);

function renderSteps() {
  const r = routine(); if (!r) return;
  const at = run ? run.i : -1;
  $("steps").innerHTML = r.steps.map((s, i) =>
    `<li class="${run && i < at ? "done" : i === at ? "now" : ""}"><span>${i + 1}. ${s.ar}${s.seconds ? ` ⏱️ ${s.seconds}s` : ""}${s.voice ? " 🎙️" : ""}</span>` +
    `<span class="lv">${run && i < at ? "✅" : LV_AR[s.level]}</span></li>`).join("");
}

/* ---------- voice ---------- */
function speak(text, opts = {}) {
  if (!text) return;
  const now = Date.now();
  if (!opts.force && text === lastSaid && now - lastSaidAt < 9000) return; // don't nag
  lastSaid = text; lastSaidAt = now;
  $("bubble").textContent = text;
  if (S.profile.quiet) { nod(); return; }                 // quiet mode: lights and a nod, no voice
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const en = S.profile.language === "en";
  const voices = speechSynthesis.getVoices();
  const v = en ? voices.find(v => v.lang.startsWith("en"))
               : (voices.find(v => /ar[-_](KW|SA|AE)/i.test(v.lang)) || voices.find(v => v.lang.startsWith("ar")));
  if (v) u.voice = v;
  u.lang = v ? v.lang : (en ? "en-US" : "ar-SA");
  u.rate = 0.9;
  $("owl").classList.add("talk");
  u.onend = () => $("owl").classList.remove("talk");
  speechSynthesis.speak(u);
}
function nod() { const o = $("owl"); o.classList.remove("nod"); void o.offsetWidth; o.classList.add("nod"); }
function playParent(r, i) {
  return new Promise(res => {
    const a = new Audio(`/api/voice/${r.id}/${i}?t=${Date.now()}`);
    a.onended = res; a.onerror = res;
    $("owl").classList.add("talk");
    a.play().catch(res).finally(() => setTimeout(() => $("owl").classList.remove("talk"), 50));
  });
}
const T = (ar, en) => S.profile.language === "en" ? en : ar;

/* announce a step at the right help level */
async function announce() {
  const r = routine(), s = r.steps[run.i], lv = s.level;
  const name = S.profile.childName;
  if (lv >= 2) { $("bubble").textContent = "👀"; setEyes("watch"); return; }   // silent: just watches
  if (lv === 0 && s.voice && !S.profile.quiet) { $("bubble").textContent = s.ar; await playParent(r, run.i); return; }
  const line = lv === 0
    ? T((name ? name + "، " : "") + s.ar, (name ? name + ", " : "") + s.en.toLowerCase())
    : T(s.ar.split(" ").slice(-1)[0] + "؟", s.en.split(" ").slice(-1)[0] + "?");
  speak(line, { force: true });
}

/* ---------- eyes: colour + ring timer ---------- */
const C = 2 * Math.PI * 66;
function setRing(frac, color) {
  ["rL", "rR"].forEach(id => { const e = $(id); e.style.strokeDashoffset = C * (1 - frac); if (color) e.setAttribute("stroke", color); });
}
function setEyes(mode) {
  const f = { coach: "#E8FFF9", watch: "#FFF3E2", calm: "#E3EEFF", off: "#FFFFFF" }[mode] || "#FFFFFF";
  $("gL").setAttribute("fill", f); $("gR").setAttribute("fill", f);
}
function startTimer(sec) {
  run.timerStart = Date.now(); run.timerSec = sec; run.timerFull = false;
  setRing(0, "#3EE6C8");
  speak(T(`كمّل لين تكمل الدائرة في عيوني`, `Keep going until the circle in my eyes is full`), { force: true });
  clearInterval(run.timerId);
  run.timerId = setInterval(() => {
    if (run.paused) { run.timerStart += 1000; return; }
    const f = Math.min(1, (Date.now() - run.timerStart) / (sec * 1000));
    setRing(f);
    if (f >= 1) { clearInterval(run.timerId); run.timerFull = true; setRing(1, "#3ED6B4"); speak(T("الدائرة كملت! 🎉", "The circle is full! 🎉"), { force: true }); }
  }, 1000);
}

/* ---------- camera loop ---------- */
function grabFrame() {
  const v = $("cam");
  const w = 512, h = Math.round(512 * (v.videoHeight / v.videoWidth || 0.75));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  c.getContext("2d").drawImage(v, 0, 0, w, h);
  return c.toDataURL("image/jpeg", 0.7);
}

async function check() {
  if (busy || !stream || !run || run.paused) return;
  const r = routine();
  if (run.i >= r.steps.length) return;
  busy = true;
  try {
    const res = await fetch("/api/coach", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ image: grabFrame(), routineId: r.id, stepIndex: run.i })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "server error");
    $("err").textContent = "";
    const st = run.steps[run.i], step = r.steps[run.i];
    if (step.seconds && !run.timerStart && data.status !== "not_visible") startTimer(step.seconds);
    if (data.status === "done" && step.seconds && !run.timerFull) {
      speak(T("شوي بعد، لين تكمل الدائرة", "A bit more, until the circle is full"));   // timed step: wait for the ring
    } else if (data.status === "done") {
      st.done = true;
      $("owl").classList.remove("happy"); void $("owl").offsetWidth; $("owl").classList.add("happy");
      const alone = st.hints === 0 && st.offTask === 0;
      if (alone && step.level > 0) speak(T("⭐ سويتها بروحك!", "⭐ You did it by yourself!"), { force: true });
      else speak(data.say || T("شاطر!", "Great job!"), { force: true });
      nextStep();
    } else {
      if (data.status === "off_task" || data.status === "not_visible") st.offTask++;
      if (data.say) { st.hints++; speak(data.say); }
    }
  } catch (e) {
    $("err").textContent = "خطأ: " + e.message;
  } finally {
    busy = false;
  }
}

function nextStep() {
  clearInterval(run.timerId); run.timerStart = 0; setRing(0);
  run.i++;
  renderSteps();
  if (run.i >= routine().steps.length) return finish(true);
  setEyes("coach");
  setTimeout(() => run && announce(), 1600);
}

/* ---------- start / stop / finish ---------- */
async function start() {
  stop(true);
  await load();
  if (!S.profile.cameraOn) return;
  const r = routine();
  BAND.alerts = 0; BAND.max = BAND.last || 0;
  run = { i: 0, t0: Date.now(), calmDowns: 0, steps: r.steps.map(() => ({ done: false, hints: 0, offTask: 0 })) };
  $("report").style.display = "none"; $("reward").style.display = "none";
  renderSteps(); setEyes("coach");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: $("facing").value }, audio: false });
    $("cam").srcObject = stream;
    if (S.profile.reward) speak(T(`أول ${r.name}، بعدين ${S.profile.reward} 🎁`, `First ${r.nameEn.toLowerCase()}, then ${S.profile.reward} 🎁`), { force: true });
    setTimeout(() => run && announce(), S.profile.reward ? 3200 : 300);
    timer = setInterval(check, CHECK_EVERY_MS);
    if (S.profile.noiseCheck) startNoiseCheck();
  } catch (e) {
    $("err").textContent = "ما قدرت أفتح الكاميرا: " + e.message;
  }
}

function stop(silent) {
  clearInterval(timer); timer = null;
  if (run) clearInterval(run.timerId);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  stopNoiseCheck(); endCalm(true);
  if (run && !silent && run.i > 0) saveSession(false);
  if (!silent) run = null;
}

async function saveSession(finished) {
  const r = routine();
  const body = { routineId: r.id, seconds: (Date.now() - run.t0) / 1000, calmDowns: run.calmDowns, bandAlerts: BAND.alerts, hrRest: BAND.rest, hrMax: BAND.max, steps: run.steps.slice(0, finished ? undefined : run.i) };
  try {
    const out = await (await fetch("/api/session", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) })).json();
    return out.changes || [];
  } catch { return []; }
}

async function finish() {
  clearInterval(timer); timer = null; stopNoiseCheck();
  const r = routine(), mins = Math.max(1, Math.round((Date.now() - run.t0) / 60000));
  const alone = run.steps.filter(s => s.done && !s.hints && !s.offTask).length;
  const hints = run.steps.reduce((n, s) => n + s.hints, 0);
  const changes = await saveSession(true);
  setTimeout(() => speak(T("عفية عليك! خلصت كل الخطوات 🎉", "Well done! You finished every step 🎉"), { force: true }), 1500);
  if (S.profile.reward) {
    $("reward").style.display = "block";
    $("reward").textContent = T(`🎁 الحين وقت: ${S.profile.reward}`, `🎁 Now it's time for: ${S.profile.reward}`);
    setTimeout(() => speak(T(`يلا! الحين ${S.profile.reward}`, `Now, ${S.profile.reward}!`), { force: true }), 4500);
  }
  const chg = changes.map(c => `<div class="chg">📉 خطوة ${c.step + 1}: رفيق بيساعد أقل (${LV_AR[c.to]}) · done alone 3 times in a row</div>`).join("") +
    changes.filter(c => c.to < c.from).map(c => `<div>↩️ خطوة ${c.step + 1}: رجع مستوى مساعدة واحد</div>`).join("");
  $("report").style.display = "block";
  $("report").innerHTML =
    `<b>📊 ملخص للأهل</b><br>` +
    `الروتين: ${r.icon} ${r.name}<br>` +
    `خطوات سواها بروحه: ${alone} / ${r.steps.length}<br>` +
    `عدد التلميحات: ${hints} · مرات التهدئة: ${run.calmDowns}<br>` +
    (S.profile.band && BAND.reads.length ? `💓 النبض: الطبيعي ${BAND.rest || "?"}، أعلى شي ${BAND.max} · تنبيهات السوار: ${BAND.alerts}<br>` : "") +
    `المدة: حوالي ${mins} دقيقة<br>${chg}` +
    `<small>Parent summary · alone ${alone}/${r.steps.length}, hints ${hints}, calm-downs ${run.calmDowns}, ~${mins} min</small>`;
  await load();
  run = null;
}

/* ---------- calm mode + calm sound ---------- */
function audio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); AC.resume(); return AC; }
function noiseBuffer(ac) {
  const b = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), d = b.getChannelData(0);
  let last = 0; for (let i = 0; i < d.length; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = last * 3.5; }  // soft brown noise
  return b;
}
function playCalmSound(kind) {
  if (kind === "none") return;
  const ac = audio(), out = ac.createGain(); out.gain.value = 0; out.connect(ac.destination);
  out.gain.linearRampToValueAtTime(0.18, ac.currentTime + 2);
  if (kind === "hum") {
    [110, 164.8].forEach(f => { const o = ac.createOscillator(); o.frequency.value = f; o.connect(out); o.start(); calmNodes.push(o); });
  } else {
    const src = ac.createBufferSource(); src.buffer = noiseBuffer(ac); src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = kind === "waves" ? 700 : 1400;
    src.connect(lp); lp.connect(out); src.start(); calmNodes.push(src);
    if (kind === "waves") {  // slow swell, like waves
      const lfo = ac.createOscillator(), depth = ac.createGain(); lfo.frequency.value = 0.12; depth.gain.value = 0.12;
      lfo.connect(depth); depth.connect(out.gain); lfo.start(); calmNodes.push(lfo);
    }
  }
  calmNodes.push({ stop: () => { out.gain.linearRampToValueAtTime(0, ac.currentTime + 1); setTimeout(() => out.disconnect(), 1200); } });
}
function startCalm(why) {
  if (!run || run.paused) return;
  run.paused = true; run.calmDowns++;
  $("calm").classList.add("on"); setEyes("calm"); setRing(1, "#7FB8FF");
  $("calmTxt").textContent = T("خذ نفس معاي… شهيق، زفير", "Breathe with me… in, and out");
  speak(T("ما عليه. خذ نفس معاي", "It's okay. Breathe with me"), { force: true });
  playCalmSound(S.profile.calmSound || "rain");
  if (why) $("err").textContent = why;
}
function endCalm(silent) {
  calmNodes.forEach(n => { try { n.stop(); } catch {} }); calmNodes = [];
  $("calm").classList.remove("on");
  if (!run || !run.paused) return;
  run.paused = false; setEyes("coach"); setRing(0, "#3EE6C8"); run.timerStart && setRing(Math.min(1, (Date.now() - run.timerStart) / (run.timerSec * 1000)), "#3EE6C8");
  if (!silent) { speak(T("أحسن؟ يلا نكمل", "Better? Let's keep going"), { force: true }); setTimeout(() => run && announce(), 2500); }
}

/* loud-noise check: if it stays loud for 1.5 s, offer calm mode */
async function startNoiseCheck() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ac = audio(), src = ac.createMediaStreamSource(micStream), an = ac.createAnalyser();
    an.fftSize = 1024; src.connect(an);
    const buf = new Float32Array(an.fftSize); let loudFor = 0;
    micTimer = setInterval(() => {
      an.getFloatTimeDomainData(buf);
      let sum = 0; for (const x of buf) sum += x * x;
      const rms = Math.sqrt(sum / buf.length);
      loudFor = rms > 0.25 ? loudFor + 250 : Math.max(0, loudFor - 250);
      if (loudFor >= 1500 && run && !run.paused) { loudFor = 0; startCalm("🔊 صوت عالي، رفيق شغّل وضع الهدوء · loud noise, calm mode on"); }
    }, 250);
  } catch (e) { $("err").textContent = "ما قدرت أفتح الميكروفون: " + e.message; }
}
function stopNoiseCheck() { clearInterval(micTimer); micTimer = null; if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; }

/* ---------- Rafeeq Band: heart rate (optional) ---------- */
// Works with any band that speaks the standard Bluetooth Heart Rate Service
// (many armbands, chest straps and some watches). Chrome or Edge, desktop or Android.
const BAND = { dev: null, sim: null, reads: [], rest: 0, last: 0, coolUntil: 0, alerts: 0, max: 0, simBoost: 0 };
function bandShow() {
  $("band").classList.toggle("on", !!S.profile.band);
  $("bandConnect").style.display = "navigator" in window && navigator.bluetooth ? "" : "none";
}
function bandInfo(text) { $("bandInfo").textContent = text; }
function onBpm(bpm) {
  if (!bpm || bpm < 30 || bpm > 230) return;
  const now = Date.now();
  BAND.reads.push({ t: now, bpm }); BAND.reads = BAND.reads.filter(r => now - r.t < 120000);
  BAND.last = bpm; BAND.max = Math.max(BAND.max, bpm);
  $("bpm").textContent = bpm;
  // resting level: set by the parent, or learned from the first minute
  if (!BAND.rest) {
    if (S.profile.bandRest) BAND.rest = S.profile.bandRest;
    else {
      const first = BAND.reads.filter(r => r.t - BAND.reads[0].t < 60000);
      if (now - BAND.reads[0].t >= 60000 && first.length >= 20) {
        const v = first.map(r => r.bpm).sort((a, b) => a - b); BAND.rest = v[Math.floor(v.length / 2)];
      } else { bandInfo(`يتعلم النبض الطبيعي… · learning resting heart rate (${Math.ceil((60000 - (now - BAND.reads[0].t)) / 1000)} s)`); return; }
    }
  }
  const limit = Math.round(BAND.rest * (1 + (S.profile.bandRise || 20) / 100));
  const recent = BAND.reads.filter(r => now - r.t < 15000), avg = recent.reduce((n, r) => n + r.bpm, 0) / recent.length;
  const up = recent.length >= 5 && avg > limit;
  $("hr").classList.toggle("up", up);
  bandInfo(`الطبيعي ${BAND.rest} · التنبيه فوق ${limit} · resting ${BAND.rest}, alert above ${limit} bpm`);
  if (up && run && !run.paused && now > BAND.coolUntil) {
    BAND.coolUntil = now + 60000; BAND.alerts++;
    startCalm(`💓 النبض ارتفع (${Math.round(avg)})، رفيق شغّل وضع الهدوء بدري · heart rate up, calm mode early`);
  }
}
async function bandConnect() {
  try {
    bandStopSim();
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ services: ["heart_rate"] }] });
    bandInfo("يتصل… · connecting…");
    const gatt = await dev.gatt.connect();
    const ch = await (await gatt.getPrimaryService("heart_rate")).getCharacteristic("heart_rate_measurement");
    ch.addEventListener("characteristicvaluechanged", e => {
      const v = e.target.value, flags = v.getUint8(0);
      onBpm(flags & 1 ? v.getUint16(1, true) : v.getUint8(1));       // standard Heart Rate Measurement format
    });
    await ch.startNotifications();
    dev.addEventListener("gattserverdisconnected", () => bandInfo("السوار انفصل · band disconnected"));
    BAND.dev = dev; BAND.reads = []; BAND.rest = 0;
    bandInfo(`متصل: ${dev.name || "heart-rate band"}`);
  } catch (e) { bandInfo("ما قدرت أوصل السوار: " + e.message); }
}
// Simulated band: only for trying the app or filming without a real band. Clearly labelled.
function bandStartSim() {
  bandStopSim(); BAND.reads = []; BAND.rest = S.profile.bandRest || 0; BAND.simBoost = 0;
  let base = 88;
  BAND.sim = setInterval(() => {
    BAND.simBoost = Math.max(0, BAND.simBoost - 0.6);
    onBpm(Math.round(base + BAND.simBoost + (Math.random() * 4 - 2)));
  }, 1000);
  if (!S.profile.bandRest) { BAND.rest = 88; }   // skip the learning minute in the simulation
  $("bandStress").style.display = "";
  bandInfo("🧪 سوار تجريبي، مو قراءات حقيقية · simulated band, not real readings");
}
function bandStopSim() { clearInterval(BAND.sim); BAND.sim = null; $("bandStress").style.display = "none"; }
$("bandConnect").onclick = bandConnect;
$("bandSim").onclick = () => BAND.sim ? (bandStopSim(), bandInfo("سوار رفيق · Rafeeq Band"), $("bpm").textContent = "—") : bandStartSim();
$("bandStress").onclick = () => { BAND.simBoost = 40; };

/* ---------- buttons ---------- */
$("go").onclick = start;
$("stop").onclick = () => { stop(false); $("bubble").textContent = "وقفنا. نكمل بعدين 👋"; renderSteps(); };
$("calmBtn").onclick = () => run ? startCalm() : null;
$("calmEnd").onclick = () => endCalm(false);
$("routine").onchange = () => { run = null; renderSteps(); };
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
load().catch(e => { $("err").textContent = "Server not reachable: " + e.message; });
</script>
